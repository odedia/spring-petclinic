<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'books')}">

<body>

  <h2>Veterinary Guide Books</h2>

  <div class="row">
    <div class="col-12">
      <div class="card mb-4">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <span class="fa fa-book"></span> AH Veterinary Guide
          </h5>
        </div>
        <div class="card-body">
          <p th:if="${pdfExists}">
            The veterinary guide is available for viewing and can be embedded into the vector store
            for AI-powered Q&A.
          </p>
          <p th:unless="${pdfExists}" class="text-danger">
            PDF file not found in resources.
          </p>

          <div class="d-flex flex-wrap gap-3 mt-4 mb-2">
            <a th:if="${pdfExists}" th:href="@{/books/pdf}" target="_blank"
              class="btn btn-outline-dark d-inline-flex align-items-center justify-content-center"
              style="padding: 0.75rem 1.5rem; font-weight: 500; border-radius: 0.5rem;">
              <span class="fa fa-eye me-2"></span> View PDF
            </a>
            <button th:if="${pdfExists}" id="embedBtn" onclick="embedPdf()"
              class="btn btn-success d-inline-flex align-items-center justify-content-center"
              style="padding: 0.75rem 1.5rem; font-weight: 500; border-radius: 0.5rem;">
              <span class="fa fa-database me-2"></span> Embed to Vector Store
            </button>
          </div>

          <div id="embedStatus" class="mt-3" style="display: none;">
            <div class="alert" role="alert"></div>
          </div>

          <p th:if="${isEmbedded}" class="text-success mt-3">
            <span class="fa fa-check-circle"></span> This document has been embedded to the vector store.
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="row" th:if="${pdfExists}">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title mb-0">PDF Preview</h5>
        </div>
        <div class="card-body p-0">
          <embed th:src="@{/books/pdf}" type="application/pdf" width="100%" height="600px" />
        </div>
      </div>
    </div>
  </div>

  <script>
    function embedPdf() {
      const btn = document.getElementById('embedBtn');
      const statusDiv = document.getElementById('embedStatus');
      const alertDiv = statusDiv.querySelector('.alert');

      btn.disabled = true;
      btn.innerHTML = '<span class="fa fa-spinner fa-spin"></span> Embedding...';
      statusDiv.style.display = 'none';

      fetch('/books/embed', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        }
      })
        .then(response => response.text().then(text => ({ ok: response.ok, text: text })))
        .then(result => {
          statusDiv.style.display = 'block';
          if (result.ok) {
            alertDiv.className = 'alert alert-success';
            alertDiv.innerHTML = '<span class="fa fa-check-circle"></span> ' + result.text;
            btn.innerHTML = '<span class="fa fa-check"></span> Embedded';
          } else {
            alertDiv.className = 'alert alert-danger';
            alertDiv.innerHTML = '<span class="fa fa-exclamation-circle"></span> ' + result.text;
            btn.disabled = false;
            btn.innerHTML = '<span class="fa fa-database"></span> Embed to Vector Store';
          }
        })
        .catch(error => {
          statusDiv.style.display = 'block';
          alertDiv.className = 'alert alert-danger';
          alertDiv.innerHTML = '<span class="fa fa-exclamation-circle"></span> Error: ' + error.message;
          btn.disabled = false;
          btn.innerHTML = '<span class="fa fa-database"></span> Embed to Vector Store';
        });
    }
  </script>

</body>

</html>
